<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChurnGuard — Customer Risk Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="noise"></div>

  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">ChurnGuard</span>
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-link active">Individual</a>
      <a href="/batch" class="nav-link">Batch</a>
      <a href="/docs" class="nav-link" target="_blank">API Docs</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="hero">
      <p class="hero-eyebrow">Powered by Explainable AI</p>
      <h1 class="hero-title">Predict Customer<br /><em>Churn Risk</em></h1>
      <p class="hero-sub">Enter customer profile to get real-time risk scoring, SHAP-based explanations & retention KPIs.</p>
    </section>

    <form id="predForm" class="pred-form" action="/predict" method="post">

      <!-- Row 1 -->
      <div class="form-grid form-grid-2">
        <div class="field">
          <label>Gender</label>
          <select name="gender" required>
            <option value="">— select —</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div class="field">
          <label>Senior Citizen</label>
          <select name="SeniorCitizen" required>
            <option value="">— select —</option>
            <option value="0">No (0)</option>
            <option value="1">Yes (1)</option>
          </select>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="form-grid form-grid-2">
        <div class="field">
          <label>Partner</label>
          <select name="Partner" required>
            <option value="">— select —</option>
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>
        <div class="field">
          <label>Dependents</label>
          <select name="Dependents" required>
            <option value="">— select —</option>
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>
      </div>

      <!-- Row 3 -->
      <div class="form-grid form-grid-3">
        <div class="field">
          <label>Tenure <span class="hint">(months)</span></label>
          <input type="number" name="tenure" min="0" max="120" step="1" placeholder="e.g. 24" required />
        </div>
        <div class="field">
          <label>Monthly Charges <span class="hint">($)</span></label>
          <input type="number" name="MonthlyCharges" min="0" step="0.01" placeholder="e.g. 65.50" required />
        </div>
        <div class="field">
          <label>Total Charges <span class="hint">($)</span></label>
          <input type="number" name="TotalCharges" min="0" step="0.01" placeholder="e.g. 1572.00" required />
        </div>
      </div>

      <!-- Divider -->
      <div class="section-label">Phone & Internet</div>

      <!-- Row 4 -->
      <div class="form-grid form-grid-3">
        <div class="field">
          <label>Phone Service</label>
          <select name="PhoneService" required>
            <option value="">— select —</option>
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>
        <div class="field">
          <label>Multiple Lines</label>
          <select name="MultipleLines" required>
            <option value="">— select —</option>
            <option>Yes</option>
            <option>No</option>
            <option>No phone service</option>
          </select>
        </div>
        <div class="field">
          <label>Internet Service</label>
          <select name="InternetService" required>
            <option value="">— select —</option>
            <option>DSL</option>
            <option>Fiber optic</option>
            <option>No</option>
          </select>
        </div>
      </div>

      <!-- Section label -->
      <div class="section-label">Add-on Services</div>

      <div class="form-grid form-grid-3">
        <div class="field">
          <label>Online Security</label>
          <select name="OnlineSecurity" required>
            <option value="">— select —</option>
            <option>Yes</option><option>No</option><option>No internet service</option>
          </select>
        </div>
        <div class="field">
          <label>Online Backup</label>
          <select name="OnlineBackup" required>
            <option value="">— select —</option>
            <option>Yes</option><option>No</option><option>No internet service</option>
          </select>
        </div>
        <div class="field">
          <label>Device Protection</label>
          <select name="DeviceProtection" required>
            <option value="">— select —</option>
            <option>Yes</option><option>No</option><option>No internet service</option>
          </select>
        </div>
      </div>

      <div class="form-grid form-grid-3">
        <div class="field">
          <label>Tech Support</label>
          <select name="TechSupport" required>
            <option value="">— select —</option>
            <option>Yes</option><option>No</option><option>No internet service</option>
          </select>
        </div>
        <div class="field">
          <label>Streaming TV</label>
          <select name="StreamingTV" required>
            <option value="">— select —</option>
            <option>Yes</option><option>No</option><option>No internet service</option>
          </select>
        </div>
        <div class="field">
          <label>Streaming Movies</label>
          <select name="StreamingMovies" required>
            <option value="">— select —</option>
            <option>Yes</option><option>No</option><option>No internet service</option>
          </select>
        </div>
      </div>

      <!-- Section label -->
      <div class="section-label">Contract & Billing</div>

      <div class="form-grid form-grid-3">
        <div class="field">
          <label>Contract</label>
          <select name="Contract" required>
            <option value="">— select —</option>
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
          </select>
        </div>
        <div class="field">
          <label>Paperless Billing</label>
          <select name="PaperlessBilling" required>
            <option value="">— select —</option>
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>
        <div class="field">
          <label>Payment Method</label>
          <select name="PaymentMethod" required>
            <option value="">— select —</option>
            <option>Electronic check</option>
            <option>Mailed check</option>
            <option>Bank transfer (automatic)</option>
            <option>Credit card (automatic)</option>
          </select>
        </div>
      </div>

      <button type="submit" class="cta-btn" id="submitBtn">
        <span class="btn-text">Analyse Risk →</span>
        <span class="btn-loading" style="display:none">Analysing…</span>
      </button>
    </form>
  </main>

  <script>
    const form = document.getElementById('predForm');
    const btn  = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.querySelector('.btn-text').style.display    = 'none';
      btn.querySelector('.btn-loading').style.display = 'inline';
      btn.disabled = true;

      const fd = new FormData(form);
      try {
        const res = await fetch('/predict', { method: 'POST', body: fd });
        if (res.ok) {
          const html = await res.text();
          document.open(); document.write(html); document.close();
        } else {
          const err = await res.json();
          alert('Error: ' + (err.detail || err.error || 'Unknown'));
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      } finally {
        btn.querySelector('.btn-text').style.display    = 'inline';
        btn.querySelector('.btn-loading').style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
