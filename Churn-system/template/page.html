<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Customer Churn Prediction</h1>
            <p>Enter customer details to predict churn probability</p>
        </div>
        
        <form id="predictionForm" action="/predict" method="post">
            <div class="row">
                <div class="form-group">
                    <label for="Gender">Gender</label>
                    <select id="Gender" name="Gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="Age">Age</label>
                    <input type="number" id="Age" name="Age" min="18" max="100" required placeholder="e.g., 35">
                    <span class="error" id="ageError">Age must be between 18 and 100</span>
                </div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="Subscription_Type">Subscription Type</label>
                    <select id="Subscription_Type" name="Subscription_Type" required>
                        <option value="">Select Type</option>
                        <option value="Basic">Basic</option>
                        <option value="Standard">Standard</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="Contract_Length">Contract Length</label>
                    <select id="Contract_Length" name="Contract_Length" required>
                        <option value="">Select Length</option>
                        <option value="Monthly">Monthly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Annual">Annual</option>
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="Tenure">Tenure (Months)</label>
                    <input type="number" id="Tenure" name="Tenure" min="0" step="1" required placeholder="e.g., 12">
                </div>
                
                <div class="form-group">
                    <label for="Usage_Frequency">Usage Frequency</label>
                    <input type="number" id="Usage_Frequency" name="Usage_Frequency" min="0" step="1" required placeholder="e.g., 15.5">
                </div>
            </div>
            
            <div class="form-group">
                <label for="Total_Spend">Total Spend (₹)</label>
                <input type="number" id="Total_Spend" name="Total_Spend" min="0" step="1" required placeholder="e.g., 1250.50">
            </div>
            
            <button type="submit" class="submit-btn">🔮 Predict Churn Risk</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Analyzing customer data...</p>
            </div>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('predictionForm');
        const loading = document.getElementById('loading');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Show loading
            loading.style.display = 'block';
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const html = await response.text();
                    document.open();
                    document.write(html);
                    document.close();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.detail || 'Prediction failed'));
                    loading.style.display = 'none';
                }
            } catch (error) {
                alert('Network error: ' + error.message);
                loading.style.display = 'none';
            }
        });
        
        const ageInput = document.getElementById('Age');
        const ageError = document.getElementById('ageError');
        
        ageInput.addEventListener('input', () => {
            const age = parseInt(ageInput.value);
            if (age < 18 || age > 100) {
                ageError.style.display = 'block';
            } else {
                ageError.style.display = 'none';
            }
        });
    </script>
</body>
</html>
