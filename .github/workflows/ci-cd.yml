name: Explanible-Churn-system

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out code
        uses: actions/checkout@v4

      - name: Setting up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
        
      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Churn-system/requirements.txt
        
      - name: Building Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/Churning-system Churn-system/Dockerfile

      - name: Checking required secrets keys
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then echo "Missing DOCKER_USERNAME" && exit 1; fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "Missing DOCKERHUB_TOKEN" && exit 1; fi

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tagging & pushing image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/Churning-system:latest ${{ secrets.DOCKER_USERNAME }}/Churning-system:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/Churning-system:latest
