name: Explanible-Churn-system

on:
  push:
    branches:
      - Churn-system

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out code
        uses: actions/checkout@v4

      - name: Setting up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
        
      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Churn-system/requirements.txt
          
      - name: Checking required secrets keys
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME}}" ]; then echo "Missing DOCKER_USERNAME" && exit 1; fi
          if [ -z "${{ secrets.DOCKER_PASSWORD}}" ]; then echo "Missing DOCKERHUB_TOKEN" && exit 1; fi
      
      - name: Building Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME}}/churning-system Churn-system

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Tagging & pushing image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME}}/Churning-system:latest ${{ secrets.DOCKER_USERNAME}}/Churning-system:latest
          docker push ${{ secrets.DOCKER_USERNAME}}/Churning-system:latest
